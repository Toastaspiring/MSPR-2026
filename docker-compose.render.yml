# Fichier auxiliaire — active le rendu d'images serveur (screenshots dashboards).
# Usage : docker compose -f docker-compose.yml -f docker-compose.render.yml up -d grafana renderer
services:
  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: mecha-renderer
    restart: unless-stopped
    networks:
      - mecha-net
    environment:
      ENABLE_METRICS: "false"

  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-mecha_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      POSTGRES_USER: ${POSTGRES_USER:-mecha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mecha_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-mecha}
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_LOG_FILTERS: rendering:debug

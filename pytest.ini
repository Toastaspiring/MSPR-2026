[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: tests d'intégration plus lourds
    slow: tests longs à exécuter

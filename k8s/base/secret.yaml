# =============================================================================
# Secret — valeurs sensibles (section 6.3 + 7.2)
# IMPORTANT : ne JAMAIS commiter de vraies valeurs ici.
# Ce fichier sert de gabarit ; en production, utiliser sealed-secrets,
# Vault, ou kubectl create secret ... --from-env-file=.env.secret.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mecha-secret
type: Opaque
stringData:
  # Token/clé d'authentification du registry interne (si Harbor on-premise)
  REGISTRY_TOKEN: "REPLACE_ME"
  # Clé d'API d'envoi d'alertes vers la GMAO (optionnel)
  ALERT_WEBHOOK_TOKEN: "REPLACE_ME"

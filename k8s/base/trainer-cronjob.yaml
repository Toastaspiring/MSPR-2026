# =============================================================================
# CronJob Trainer — réentraînement périodique des modèles
# Planifié hors heures de pointe (section 7.2 — pas de conflit avec l'API).
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trainer
  labels:
    app.kubernetes.io/name: trainer
    app.kubernetes.io/component: training
spec:
  # Chaque dimanche à 02h00 UTC (cf. RETRAIN_CRON_SCHEDULE)
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800   # 7 jours
      template:
        metadata:
          labels:
            app.kubernetes.io/name: trainer
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          containers:
            - name: trainer
              image: ghcr.io/mecha/trainer:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: mecha-config
              volumeMounts:
                - name: gold
                  mountPath: /data/gold
                  readOnly: true
                - name: models
                  mountPath: /models
                - name: logs
                  mountPath: /logs
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "4000m"
                  memory: "4Gi"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
          volumes:
            - name: gold
              persistentVolumeClaim:
                claimName: gold-data
            - name: models
              persistentVolumeClaim:
                claimName: models-store
            - name: logs
              persistentVolumeClaim:
                claimName: logs-store

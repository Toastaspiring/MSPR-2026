# =============================================================================
# CD — Déploiement vers le cluster de staging (cf. section 5.3)
# Déclenché après une CI réussie sur `main` : met à jour les manifestes
# Kubernetes avec le nouveau tag d'image et commite la mise à jour, ce qui
# déclenche le rolling update via Argo CD / Flux ou un kubectl apply manuel.
# =============================================================================
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag d'image à déployer (ex: sha-abc123)"
        required: true
        type: string
      environment:
        description: "Environnement cible"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: write   # commit des manifestes mis à jour
  pull-requests: write

jobs:
  update-manifests:
    name: Mise à jour des manifestes K8s
    runs-on: ubuntu-latest
    # Ne se déclenche que si la CI a réussi (ou en manuel)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Déterminer le tag d'image
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "env=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer kustomize
        run: |
          curl -sSL -o /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin
          kustomize version

      - name: Mettre à jour les tags d'image dans l'overlay
        working-directory: k8s/overlays/${{ steps.tag.outputs.env == 'production' && 'central' || 'edge' }}
        run: |
          for svc in etl trainer api scheduler; do
            kustomize edit set image ghcr.io/${{ github.repository_owner }}/mecha-$svc=ghcr.io/${{ github.repository_owner }}/mecha-$svc:${{ steps.tag.outputs.value }}
          done

      - name: Commit & push de la mise à jour
        run: |
          git config user.name  "mecha-cd[bot]"
          git config user.email "mecha-cd@users.noreply.github.com"
          git add k8s/overlays/
          if git diff --staged --quiet; then
            echo "Aucune modification de manifeste."
          else
            git commit -m "chore(cd): bump images to ${{ steps.tag.outputs.value }} (${{ steps.tag.outputs.env }})"
            git push
          fi

  # ---------------------------------------------------------------------------
  # Application optionnelle au cluster (si KUBE_CONFIG fourni en secret)
  # ---------------------------------------------------------------------------
  apply-to-cluster:
    name: Apply au cluster K3s
    runs-on: ubuntu-latest
    needs: update-manifests
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence du kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::warning::KUBE_CONFIG non défini — déploiement manuel attendu sur les clusters K3s."
            exit 0
          fi

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configurer kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply (kubectl)
        run: |
          kubectl apply -k k8s/overlays/${{ inputs.environment == 'production' && 'central' || 'edge' }}
          kubectl -n mecha-${{ inputs.environment }} rollout status deployment/api --timeout=5m
          kubectl -n mecha-${{ inputs.environment }} rollout status deployment/grafana --timeout=5m
